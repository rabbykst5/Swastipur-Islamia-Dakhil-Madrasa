<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এডমিন প্যানেল - সুবর্ণজয়ন্তী উৎসব</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f1f5f9; padding: 20px; }
    .header-box { text-align: center; margin-bottom: 25px; }
    .header-box h1 { color: #1e3a8a; font-size: 24px; margin-bottom: 4px; }
    .header-box p { color: #64748b; font-size: 15px; }

    /* Login Modal */
    #loginModal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .login-card { background: #fff; padding: 30px; border-radius: 10px; width: 320px; text-align: center; }
    .login-card input { width: 100%; padding: 10px; margin: 12px 0; border: 1px solid #cbd5e1; border-radius: 6px; }
    .login-card button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }

    /* Control Bar */
    .controls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 20px auto; }
    .search-inputs { display: flex; gap: 10px; flex-wrap: wrap; }
    .search-inputs input { padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; min-width: 250px; font-size: 14px; }
    .stats-badge { background: #0f172a; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; }
    .btn-print { background: #0284c7; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; }

    /* Grid Display */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
    .card { background: #ffffff; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; border-top: 4px solid #2563eb; }
    .card-photo { width: 105px; height: 125px; object-fit: cover; border-radius: 6px; border: 1.5px solid #cbd5e1; margin-bottom: 10px; }
    .card h3 { font-size: 18px; color: #0f172a; margin-bottom: 5px; }
    .batch-badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-bottom: 12px; }
    .card-info { text-align: left; font-size: 13px; color: #475569; line-height: 1.6; border-top: 1px solid #f1f5f9; padding-top: 8px; }
    .card-info strong { color: #1e293b; }

    @media print {
      body { background: #fff; padding: 0; }
      .controls, .header-box p { display: none; }
      .grid { display: block; }
      .card { page-break-inside: avoid; margin-bottom: 15px; border: 1px solid #ddd; }
    }
  </style>
</head>
<body>

  <div id="loginModal">
    <div class="login-card">
      <h3 style="margin-bottom: 10px; color: #1e293b;">অ্যাডমিন লগইন</h3>
      <input type="password" id="adminPass" placeholder="পাসওয়ার্ড দিন">
      <button onclick="checkLogin()">লগইন করুন</button>
      <div id="loginErr" style="color: red; font-size: 12px; margin-top: 8px;"></div>
    </div>
  </div>

  <div class="header-box">
    <h1>স্বস্তিপুর ইসলামিয়া দাখিল মাদ্রাসা</h1>
    <p>সুবর্ণজয়ন্তী উৎসব — কেন্দ্রীয় শিক্ষার্থী ডাটাবেজ</p>
  </div>

  <div class="controls">
    <div class="search-inputs">
      <input type="text" id="searchInput" placeholder="নাম, মোবাইল বা পেশা দিয়ে খুঁজুন..." onkeyup="filterData()">
      <input type="text" id="batchInput" placeholder="নির্দিষ্ট ব্যাচ খুঁজুন..." onkeyup="filterData()">
    </div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <span class="stats-badge" id="totalCount">মোট: ০ জন</span>
      <button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button>
    </div>
  </div>

  <div id="loader" style="text-align: center; color: #64748b; margin-top: 40px;">ডাটা লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</div>
  <div class="grid" id="studentsContainer"></div>

  <script>
    // আপনার নতুন Web App URL
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxhGJXqi5sqTO-WrAO5oGgiQxFfRKJ7lOA7M7XUS3LqLTnCgOjMqoDInP2TsvXU5l3hOw/exec';
    const ADMIN_PASSWORD = 'admin123'; 

    let allStudents = [];

    function checkLogin() {
      const pass = document.getElementById('adminPass').value;
      if (pass === ADMIN_PASSWORD) {
        document.getElementById('loginModal').style.display = 'none';
        loadRegistrations();
      } else {
        document.getElementById('loginErr').innerText = 'ভুল পাসওয়ার্ড!';
      }
    }

    function loadRegistrations() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          allStudents = data;
          document.getElementById('loader').style.display = 'none';
          renderCards(allStudents);
        })
        .catch(err => {
          document.getElementById('loader').innerText = 'তথ্য লোড করতে ব্যর্থ হয়েছে!';
          console.error(err);
        });
    }

    function renderCards(list) {
      const container = document.getElementById('studentsContainer');
      const totalCount = document.getElementById('totalCount');
      container.innerHTML = '';
      totalCount.innerText = `মোট: ${list.length} জন`;

      if (list.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #64748b;">কোনো শিক্ষার্থীর তথ্য পাওয়া যায়নি।</div>';
        return;
      }

      list.forEach(student => {
        let fileId = '';
        if (student.photoLink && student.photoLink.includes('/d/')) {
          fileId = student.photoLink.split('/d/')[1].split('/')[0];
        }
        const imgUrl = fileId ? `https://lh3.googleusercontent.com/d/${fileId}` : 'https://via.placeholder.com/105x125?text=No+Photo';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img class="card-photo" src="${imgUrl}" alt="ছবি" onerror="this.src='https://via.placeholder.com/105x125?text=Error'">
          <h3>${student.name}</h3>
          <span class="batch-badge">ব্যাচ: ${student.batch} (পাস: ${student.passingYear})</span>
          <div class="card-info">
            <p><strong>পিতা:</strong> ${student.fatherName}</p>
            <p><strong>মাতা:</strong> ${student.motherName}</p>
            <p><strong>মোবাইল:</strong> ${student.phone}</p>
            <p><strong>পেশা:</strong> ${student.profession}</p>
            <p><strong>ঠিকানা:</strong> ${student.address}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const batchQuery = document.getElementById('batchInput').value.toLowerCase();

      const filtered = allStudents.filter(item => {
        const matchesGeneral = 
          (item.name && item.name.toLowerCase().includes(query)) ||
          (item.phone && item.phone.includes(query)) ||
          (item.profession && item.profession.toLowerCase().includes(query));
        
        const matchesBatch = 
          !batchQuery || 
          (item.batch && item.batch.toString().toLowerCase().includes(batchQuery)) ||
          (item.passingYear && item.passingYear.toString().includes(batchQuery));

        return matchesGeneral && matchesBatch;
      });

      renderCards(filtered);
    }
  </script>
</body>
</html>
